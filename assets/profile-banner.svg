<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#1a1440"/>
      <stop offset="100%" stop-color="#0f0c29"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e0ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <g stroke="#2a2560" stroke-width="1" opacity="0.5">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="150" y1="0" x2="150" y2="300"/>
    <line x1="1050" y1="0" x2="1050" y2="300"/>
  </g>

  <g fill="#00e0ff" opacity="0.8">
    <circle cx="150" cy="60" r="4"/>
    <circle cx="1050" cy="60" r="4"/>
    <circle cx="150" cy="240" r="4"/>
    <circle cx="1050" cy="240" r="4"/>
  </g>
  <g stroke="#00e0ff" stroke-width="1.5" opacity="0.6" fill="none">
    <path d="M 60 30 L 150 30 L 150 60"/>
    <path d="M 1140 30 L 1050 30 L 1050 60"/>
    <path d="M 60 270 L 150 270 L 150 240"/>
    <path d="M 1140 270 L 1050 270 L 1050 240"/>
  </g>

  <text x="600" y="150" text-anchor="middle" font-family="'Segoe UI', 'Fira Code', monospace" font-size="46" font-weight="700" fill="#ffffff" filter="url(#softGlow)">
    Muhammad Rizky Gurmilang
  </text>

  <text x="600" y="195" text-anchor="middle" font-family="'Fira Code', monospace" font-size="20" fill="url(#glow)">
    Full-Stack Developer · AI Systems · Network Tools
  </text>

  <rect x="450" y="215" width="300" height="2" fill="url(#glow)" opacity="0.8"/>
</svg>