name: Update streak stats

on:
    schedule:
        - cron: "0 3 * * *" # tiap hari jam 03:00 UTC
    push:
        paths:
            - ".github/workflows/streak-stats.yml"
    workflow_dispatch: # bisa di-trigger manual dari tab Actions

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4

            - name: Generate streak stats
              uses: DenverCoder1/github-readme-streak-stats@main
              with:
                  options: user=${{ github.repository_owner }}&theme=dark&hide_border=true&background=0D1117&ring=00E0FF&fire=00E0FF&currStreakLabel=00E0FF
                  path: assets/streak-stats.svg
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Commit streak stats
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add assets/streak-stats.svg
                  git commit -m "Update streak stats - [Skip GitHub Action]" || exit 0
                  git push